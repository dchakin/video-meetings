services:
  db:
    image: postgres:17-alpine
    container_name: video-meetings-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-video_meetings}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-video_meetings}
      POSTGRES_DB: ${POSTGRES_DB:-video_meetings}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-video_meetings} -d ${POSTGRES_DB:-video_meetings}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
